<!doctype html>
<!--
  社交预览候选:极简黑猫。不用插画,只用矢量的 mascot/cat-emblem.svg,缩略图尺寸下最干净、体积最小。
  渲染:Build-SocialPreview.ps1(渲染本目录全部 .html)。
-->
<html lang="zh-CN">

  <head>
    <meta charset="utf-8">
    <title>VelaShell social preview · cat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #0A1614 0%, #0B1C19 60%, #0E2521 100%);
        color: #E9FBF4;
        -webkit-font-smoothing: antialiased;
      }

      .ring {
        position: absolute;
        right: 90px;
        top: 70px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, #1C5E51 0%, #123F37 45%, rgba(18, 63, 55, 0) 70%);
      }

      .ring::after {
        content: "";
        position: absolute;
        inset: 60px;
        border-radius: 50%;
        border: 2px dashed rgba(47, 216, 171, .28);
      }

      .cat {
        position: absolute;
        right: 160px;
        top: 120px;
        width: 360px;
        height: 360px;
        filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .5));
      }

      .brand {
        position: absolute;
        left: 76px;
        top: 150px;
      }

      .wordmark {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -2px;
        line-height: 1;
      }

      .wordmark b {
        font-weight: 700;
        color: #2FD8AB;
      }

      .prompt {
        margin-top: 26px;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 28px;
        color: #9FD8C8;
      }

      .prompt .ps {
        color: #2FD8AB;
      }

      .caret {
        display: inline-block;
        width: 14px;
        height: 30px;
        margin-left: 6px;
        vertical-align: -5px;
        background: #2FD8AB;
      }

      .tagline {
        margin-top: 30px;
        font-size: 28px;
        font-weight: 600;
        color: #CDEFE4;
      }

      .sub {
        margin-top: 10px;
        font-size: 18px;
        color: #5E9086;
      }

      .paws {
        position: absolute;
        fill: #2FD8AB;
      }

      .footer {
        position: absolute;
        left: 76px;
        bottom: 44px;
        font-size: 17px;
        color: #4F7D73;
      }
    </style>
  </head>

  <body>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <symbol id="paw" viewBox="0 0 64 64">
          <ellipse cx="32" cy="42" rx="15" ry="13" />
          <ellipse cx="13" cy="26" rx="6.5" ry="8" transform="rotate(-18 13 26)" />
          <ellipse cx="25" cy="15" rx="6.5" ry="8.5" transform="rotate(-6 25 15)" />
          <ellipse cx="39" cy="15" rx="6.5" ry="8.5" transform="rotate(6 39 15)" />
          <ellipse cx="51" cy="26" rx="6.5" ry="8" transform="rotate(18 51 26)" />
        </symbol>
      </defs>
    </svg>

    <div class="ring"></div>
    <img class="cat" src="../../mascot/cat-emblem.svg" alt="">

    <section class="brand">
      <div class="wordmark">Vela<b>Shell</b></div>
      <div class="prompt"><span class="ps">$</span> ssh --to anywhere <span style="color:#F4C44E">=^･ω･^=</span><span class="caret"></span></div>
      <div class="tagline">现代化跨平台 SSH / SFTP / FTP 终端客户端</div>
      <div class="sub">.NET 11 · Avalonia · Windows / Linux / macOS</div>
    </section>

    <!-- 从文案走向黑猫的一串猫爪印 -->
    <svg class="paws" style="left:640px;top:500px;width:22px;height:22px;opacity:.25;transform:rotate(-60deg)"><use href="#paw" /></svg>
    <svg class="paws" style="left:676px;top:470px;width:24px;height:24px;opacity:.4;transform:rotate(-50deg)"><use href="#paw" /></svg>
    <svg class="paws" style="left:704px;top:510px;width:24px;height:24px;opacity:.55;transform:rotate(-55deg)"><use href="#paw" /></svg>
    <svg class="paws" style="left:742px;top:478px;width:26px;height:26px;opacity:.75;transform:rotate(-45deg)"><use href="#paw" /></svg>

    <div class="footer">github.com/joesdu/VelaShell &nbsp;|&nbsp; AGPL-3.0 / 商业双许可</div>
  </body>

</html>
